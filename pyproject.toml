[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-logtriage"
version = "0.1.0"
description = "Jev decides whether a batch of logs is worth acting on"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonathan Yates" }]
keywords = ["jev", "typesafe", "loki", "observability", "sre", "logs"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
]
dependencies = ["typesafe-sdk>=0.7.0"]

[project.urls]
Homepage = "https://github.com/jyatesdotdev/jev-logtriage"
Documentation = "https://docs.typesafe.ai/patterns"
Source = "https://github.com/jyatesdotdev/jev-logtriage"

[project.scripts]
logtriage = "logtriage.cli:main"

[tool.setuptools.packages.find]
include = ["logtriage"]

[tool.setuptools.package-data]
logtriage = ["fixtures/*.json"]

[dependency-groups]
dev = [
    "pycodestyle>=2.14.0",
]
